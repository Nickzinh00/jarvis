name: Windows desktop build and verification

on:
  push:
    branches: [main, jarvis-windows-executor]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Commit synchronized npm lockfile
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: synchronize npm lockfile"
            git push
          } else {
            Write-Host "package-lock.json is already synchronized."
          }

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Test suite
        run: npm test

      - name: Build Windows x64 NSIS installer
        run: npm run dist:win

      - name: Verify installer exists
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem -Path release -Filter "*.exe" -File
          if (-not $installer) { throw "No Windows installer EXE was produced." }
          $installer | ForEach-Object { Write-Host "$($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-x64-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload production web build
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
