name: Windows desktop build and verification

on:
  push:
    branches: [main, jarvis-windows-executor, 'release/*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Parse Windows PowerShell helpers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('install-windows.ps1', 'start-windows.ps1', 'configure-provider.ps1', 'install-ollama.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file has PowerShell syntax errors: $($errors -join '; ')" }
            Write-Host "PowerShell syntax OK: $file"
          }

      - name: Production build
        run: npm run build

      - name: Test suite
        run: npm test

      - name: Build Windows x64 NSIS installer
        run: npm run dist:win

      - name: Verify installer exists
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem -Path release -Filter "*.exe" -File
          if (-not $installer) { throw "No Windows installer EXE was produced." }
          $installer | ForEach-Object { Write-Host "$($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB" }

      - name: Create installer SHA-256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem -Path release -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "No installer available for checksum." }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Out-File -FilePath (Join-Path $installer.DirectoryName ($installer.Name + ".sha256")) -Encoding ascii

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-x64-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          target_commitish: ${{ github.sha }}
          name: JARVIS 1.0.1 — Security and chat update
          body: |
            ## JARVIS 1.0.1 — Windows x64

            Security-focused update: third-party MCP servers now require an explicit allowlist; file/browser write permissions and arbitrary shell access are separate opt-ins. Includes a keyboard chat composer and dependency vulnerability audit in CI.

            Instalador desktop para Windows 10/11 (64 bits).

            ### Instalação
            1. Baixe e execute `JARVIS-Setup-1.0.1-x64.exe`.
            2. Abra o JARVIS e use a opção de instalação do Ollama local.
            3. Escolha o modelo Qwen3-VL 4B ou 2B e conclua a configuração.

            O modelo de IA é baixado separadamente durante a configuração. Provedores de nuvem são opcionais e podem exigir chave/API e cobrança próprias.

            ### Observações
            - O instalador não vem assinado por certificado comercial; o Windows pode exibir um aviso de editor desconhecido.
            - O modelo local não está incluído no instalador.
          files: release/*.exe
            release/*.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: false
          make_latest: true

      - name: Upload production web build
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
